<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>PDF Compressor - Compress PDF Files Online | QuickToolHub</title>

<meta name="description" content="Compress PDF files online with QuickToolHub's free PDF Compressor. Reduce PDF file size quickly while maintaining good quality.">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://mq3725-web.github.io/quicktoolhub/pdf-compressor.html">

<meta property="og:title" content="PDF Compressor - Compress PDF Files Online">

<meta property="og:description" content="Free online PDF Compressor to reduce PDF file size quickly while maintaining good quality.">

<meta property="og:url" content="https://mq3725-web.github.io/quicktoolhub/pdf-compressor.html">

<meta property="og:type" content="website">

<meta property="og:site_name" content="QuickToolHub">

    <link rel="stylesheet" href="pdf-compressor.css">
</head>

<body>

    <div class="container">

        <h1>PDF Compressor</h1>

        <p class="description">
            Compress your PDF files and reduce their size while keeping good quality.
        </p>

        <div class="tool-box">

            <div id="uploadArea" class="upload-area">
                <div class="upload-icon">📄</div>

                <h3>Upload PDF</h3>

                <p>Click here or drag & drop your PDF file</p>

                <input
                    type="file"
                    id="fileInput"
                    accept="application/pdf"
                    hidden
                >
            </div>

            <p id="fileInfo" class="file-info">
                No file selected
            </p>

            <div class="option-group">

                <label for="compressionLevel">
                    Compression Level
                </label>

                <select id="compressionLevel">
                    <option value="low">Low - Better Quality</option>
                    <option value="medium" selected>Medium - Recommended</option>
                    <option value="high">High - Smaller Size</option>
                </select>

            </div>

            <div class="buttons">

                <button id="compressBtn" disabled>
                    Compress PDF
                </button>

                <button id="clearBtn" type="button">
                    Clear
                </button>

            </div>

            <div id="progressContainer" style="display:none;">

                <div class="progress">
                    <div id="progressBar"></div>
                </div>

                <p id="progressText"></p>

            </div>

            <div id="result" class="result" style="display:none;"></div>

            <button
                id="downloadBtn"
                style="display:none;"
            >
                Download Compressed PDF
            </button>

        </div>

    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Our JavaScript -->
    <script src="pdf-compressor.js"></script>

</body>
</html>
